services:

  # Хранилище логов
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: taskmanager-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Обработка логов
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.4
    container_name: taskmanager-logstash
    ports:
      - "5044:5044"
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Визуализация логов
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    container_name: taskmanager-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Сбор логов из файла
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.4
    container_name: taskmanager-filebeat
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/taskmanager:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - logstash
    restart: unless-stopped

volumes:
  elasticsearch-data:
  filebeat-data:

networks:
  default:
    name: taskmanager-elk-network