input {
  beats {
    port => 5044
  }
}

filter {
  if [@timestamp] {
    date {
      match => ["[@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "taskmanager-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
